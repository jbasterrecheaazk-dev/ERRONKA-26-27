<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoinuTruk — Perfil</title>
    <style>
        /* Variables y reset */
        :root {
            --bg: #121212;
            --bg-2: #151515;
            --text: #EBEBEB;
            --muted: #a0a0a0;
            --border: #333333;
            --accent: #F5F5F5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Iconos SVG visibles */
        svg {
            stroke: var(--text);
        }

        body {
            font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }

        /* Layout */
        .header{position:sticky;top:0;z-index:10;background:#121212;border-bottom:1px solid var(--border)}
        .container{width:min(1120px,92%);margin-inline:auto}

        /* Header BEM */
        .header__inner{display:flex;align-items:center;gap:24px;padding:18px 0}
        .header__brand{display:flex;align-items:center;gap:12px}
        .header__logo-icon{width:36px;height:36px;display:block}
        .header__logo{font-weight:700;letter-spacing:.2px}
        .header__logo span{color:var(--accent)}
        .header__search{flex:1;display:flex;align-items:center;background:var(--bg-2);border:1px solid var(--border);border-radius:0;padding:12px 16px;gap:10px}
        .header__search input{flex:1;background:transparent;outline:none;color:var(--text)}
        .header__actions{display:flex;align-items:center;gap:16px}
        .header__icon-btn{width:44px;height:44px;border-radius:0;background:var(--bg-2);border:1px solid var(--border);display:grid;place-items:center}
        .badge{position:absolute;transform:translate(10px,-10px);background:var(--border);color:var(--accent);font-size:.7rem;font-weight:600;padding:2px 6px;border-radius:0;border:1px solid var(--border)}
        .profile {
            display: grid;
            grid-template-columns: minmax(300px, 360px) 1fr;
            gap: 48px;
            padding: 80px 20px 120px;
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (max-width: 960px) {
            .profile {
                grid-template-columns: 1fr;
            }
        }

        /* Sidebar */
        .sidebar {
            background: var(--bg-2);
            border: 1px solid var(--border);
            padding: 32px;
            position: sticky;
            top: 24px;
            height: fit-content;
        }

        .sidebar__title {
            font-weight: 600;
            font-size: 1.3rem;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav__btn {
            padding: 12px 16px;
            background: transparent;
            border: 1px solid transparent;
            color: var(--muted);
            text-align: left;
            font-family: inherit;
            font-size: 1rem;
            cursor: pointer;
        }

        .nav__btn--active {
            background: var(--bg);
            border-color: var(--border);
            color: var(--text);
        }

        /* Paneles */
        .panels {
            display: flex;
            flex-direction: column;
            gap: 48px;
        }

        .panel {
            display: none;
        }

        .panel--active {
            display: block;
        }

        .panel__title {
            font-weight: 600;
            font-size: 1.6rem;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        /* Historial de pedidos */
        .orders {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .order {
            background: var(--bg-2);
            border: 1px solid var(--border);
            padding: 24px;
        }

        .order__header {
            display: flex;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        .order__id {
            color: var(--muted);
            font-size: 0.85rem;
        }

        .order__total {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 1.1rem;
        }

        .order__items {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .order__item {
            display: flex;
            justify-content: space-between;
            color: var(--muted);
        }

        /* Formulario de venta */
        .form__group {
            margin-bottom: 32px;
        }

        .form__label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 14px 16px;
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
        }

        .textarea {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 14px 16px;
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            min-height: 120px;
            resize: vertical;
        }

        .form__grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        @media (max-width: 640px) {
            .form__grid {
                grid-template-columns: 1fr;
            }
        }

        .btn {
            padding: 14px 20px;
            background: var(--bg-2);
            border: 1px solid var(--border);
            color: var(--text);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            font-family: inherit;
            max-width: 240px;
        }

        .btn--primary {
            background: #EBEBEB;
            color: #121212;
            border-color: var(--accent);
        }

        .btn--primary:hover {
            filter: brightness(0.9);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header__inner">
            <div class="header__brand">
                <img class="header__logo-icon" src="LogoErronka_Logo_sinfonfo.png" alt="SoinuTruk logo">
                <div class="header__logo">Soinu<span>Truk</span></div>
            </div>
            <div class="header__search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input placeholder="Buscar vinilos, CDs, casetes, artistas..." />
            </div>
            <div class="header__actions">
                <button class="header__icon-btn" aria-label="Carrito" style="position:relative">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 12.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                    <span class="badge">3</span>
                </button>
                <button class="header__icon-btn" aria-label="Login">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </button>
            </div>
        </div>
    </header>
    <main class="profile">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h2 class="sidebar__title">Mi perfil</h2>
            <nav class="nav">
                <button class="nav__btn nav__btn--active" data-target="orders">Pedidos</button>
                <button class="nav__btn" data-target="sell">Vender disco</button>
            </nav>
        </aside>

        <!-- Paneles -->
        <section class="panels">
            <!-- Historial de pedidos -->
            <div class="panel panel--active" id="orders">
                <h2 class="panel__title">Historial de pedidos</h2>
                <div class="orders">
                    <article class="order">
                        <div class="order__header">
                            <div>
                                <div class="order__id">Pedido #00123</div>
                                <div>21/03/2026</div>
                            </div>
                            <div class="order__total">153,00 €</div>
                        </div>
                        <div class="order__items">
                            <div class="order__item">
                                <span>Pink Floyd — The Dark Side of the Moon</span>
                                <span>89,00 €</span>
                            </div>
                            <div class="order__item">
                                <span>Fleetwood Mac — Rumours</span>
                                <span>64,00 €</span>
                            </div>
                        </div>
                    </article>

                    <article class="order">
                        <div class="order__header">
                            <div>
                                <div class="order__id">Pedido #00112</div>
                                <div>14/03/2026</div>
                            </div>
                            <div class="order__total">72,00 €</div>
                        </div>
                        <div class="order__items">
                            <div class="order__item">
                                <span>Nirvana — Nevermind</span>
                                <span>72,00 €</span>
                            </div>
                        </div>
                    </article>
                </div>
            </div>

            <!-- Formulario de venta -->
            <div class="panel" id="sell">
                <h2 class="panel__title">Publicar disco en venta</h2>
                <form>
                    <div class="form__grid">
                        <div class="form__group">
                            <label class="form__label" for="artist">Artista</label>
                            <input class="input" id="artist" type="text" required>
                        </div>
                        <div class="form__group">
                            <label class="form__label" for="title">Título</label>
                            <input class="input" id="title" type="text" required>
                        </div>
                    </div>
                    <div class="form__group">
                        <label class="form__label" for="condition">Estado de conservación</label>
                        <input class="input" id="condition" type="text" required>
                    </div>
                    <div class="form__group">
                        <label class="form__label" for="year">Año</label>
                        <input class="input" id="year" type="number" required>
                    </div>
                    <div class="form__group">
                        <label class="form__label" for="price">Precio (€)</label>
                        <input class="input" id="price" type="number" step="0.01" required>
                    </div>
                    <div class="form__group">
                        <label class="form__label" for="description">Descripción</label>
                        <textarea class="textarea" id="description" required></textarea>
                    </div>
                    <button class="btn btn--primary" type="submit">Publicar anuncio</button>
                </form>
            </div>
        </section>
    </main>

    <script>
        // Cambiar paneles
        document.querySelectorAll('.nav__btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const target = btn.dataset.target;
                document.querySelectorAll('.nav__btn').forEach(b => b.classList.remove('nav__btn--active'));
                btn.classList.add('nav__btn--active');
                document.querySelectorAll('.panel').forEach(panel => {
                    panel.classList.remove('panel--active');
                });
                document.getElementById(target).classList.add('panel--active');
            });
        });
    </script>
</body>
</html>

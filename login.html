<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoinuTruk — Acceso</title>
    <style>
        /* Variables y reset */
        :root {
            --bg: #121212;
            --bg-2: #151515;
            --text: #EBEBEB;
            --muted: #a0a0a0;
            --border: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Variables y reset */
:root {
    --bg: #121212;
    --bg-2: #151515;
    --text: #EBEBEB;
    --muted: #a0a0a0;
    --border: #333333;
    --accent: #F5F5F5;
}

/* Iconos SVG visibles */
svg {
    stroke: var(--text);
}

body {
    font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
}

/* Layout */
.header{position:sticky;top:0;z-index:10;background:#121212;border-bottom:1px solid var(--border)}
.container{width:min(1120px,92%);margin-inline:auto}

/* Header BEM */
.header__inner{display:flex;align-items:center;gap:24px;padding:18px 0}
.header__brand{display:flex;align-items:center;gap:12px}
.header__logo-icon{width:36px;height:36px;display:block}
.header__logo{font-weight:700;letter-spacing:.2px}
.header__logo span{color:var(--accent)}
.header__search{flex:1;display:flex;align-items:center;background:var(--bg-2);border:1px solid var(--border);border-radius:0;padding:12px 16px;gap:10px}
.header__search input{flex:1;background:transparent;outline:none;color:var(--text)}
.header__actions{display:flex;align-items:center;gap:16px}
.header__icon-btn{width:44px;height:44px;border-radius:0;background:var(--bg-2);border:1px solid var(--border);display:grid;place-items:center}
.badge{position:absolute;transform:translate(10px,-10px);background:var(--border);color:var(--accent);font-size:.7rem;font-weight:600;padding:2px 6px;border-radius:0;border:1px solid var(--border)}

        /* Contenedor principal */
        .login {
            width: min(420px, 92%);
            margin: 24px auto;
            background: var(--bg-2);
            border: 1px solid var(--border);
            padding: 48px 32px;
        }

        .login__tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border);
        }

        .tab {
            padding: 12px 16px;
            background: transparent;
            border: none;
            font-weight: 600;
            color: var(--muted);
            cursor: pointer;
            position: relative;
        }

        .tab--active {
            color: var(--text);
        }

        .tab--active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background: currentColor;
        }

        /* Formulario */
        .form {
            display: none;
        }

        .form--active {
            display: block;
        }

        .form__group {
            margin-bottom: 32px;
        }

        .form__label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 14px 16px;
            color: var(--text);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
        }

        .input:focus {
            border-color: var(--text);
        }

        .btn {
            width: 100%;
            padding: 14px 20px;
            background: var(--bg-2);
            border: 1px solid var(--border);
            color: var(--text);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            font-family: inherit;
        }

        .btn--primary {
            background: #EBEBEB;
            color: #121212;
            border-color: var(--accent);
        }

        .btn--primary:hover {
            filter: brightness(0.9);
        }

        .form__footer {
            margin-top: 32px;
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .link {
            color: var(--text);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header__inner">
            <div class="header__brand">
                <img class="header__logo-icon" src="LogoErronka_Logo_sinfonfo.png" alt="SoinuTruk logo">
                <div class="header__logo">Soinu<span>Truk</span></div>
            </div>
            <div class="header__search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input placeholder="Buscar vinilos, CDs, casetes, artistas..." />
            </div>
            <div class="header__actions">
                <button class="header__icon-btn" aria-label="Carrito" style="position:relative">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 12.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                    <span class="badge">3</span>
                </button>
                <button class="header__icon-btn" aria-label="Login">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </button>
            </div>
        </div>
    </header>
    <main class="login">
        <div class="login__tabs">
            <button class="tab tab--active" data-target="login">Iniciar sesión</button>
            <button class="tab" data-target="register">Registrarse</button>
        </div>

        <!-- Formulario Login -->
        <form class="form form--active" id="login">
            <div class="form__group">
                <label class="form__label" for="email-login">Correo electrónico</label>
                <input class="input" id="email-login" type="email" required>
            </div>
            <div class="form__group">
                <label class="form__label" for="password-login">Contraseña</label>
                <input class="input" id="password-login" type="password" required>
            </div>
            <button class="btn btn--primary" type="submit">Entrar</button>
            <div class="form__footer">
                ¿Olvidaste tu contraseña? <a class="link" href="#">Recuperar</a>
            </div>
        </form>

        <!-- Formulario Registro -->
        <form class="form" id="register">
            <div class="form__group">
                <label class="form__label" for="email-reg">Correo electrónico</label>
                <input class="input" id="email-reg" type="email" required>
            </div>
            <div class="form__group">
                <label class="form__label" for="password-reg">Contraseña</label>
                <input class="input" id="password-reg" type="password" required>
            </div>
            <div class="form__group">
                <label class="form__label" for="username">Nombre de usuario</label>
                <input class="input" id="username" type="text" required>
            </div>
            <button class="btn btn--primary" type="submit">Crear cuenta</button>
            <div class="form__footer">
                Al registrarte aceptas nuestros <a class="link" href="#">Términos</a>
            </div>
        </form>
    </main>

    <script>
        // Cambiar pestañas
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const target = tab.dataset.target;
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('tab--active'));
                tab.classList.add('tab--active');
                document.querySelectorAll('.form').forEach(form => {
                    form.classList.remove('form--active');
                });
                document.getElementById(target).classList.add('form--active');
            });
        });
    </script>
</body>
</html>
